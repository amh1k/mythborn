# No-card hobby deployment. See DEPLOYMENT.md for sleep and quota limits.
# render.paid.yaml retains the separate always-on service configuration.
services:
  - type: web
    name: mythborn-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./deploy/free/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    numInstances: 1
    envVars:
      - key: HTTP_ADDRESS
        value: ':10000'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: mythborn-photos
      - key: GEMINI_API_KEY
        sync: false
      - key: SQL_HOST
        sync: false
      - key: SQL_PORT
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_DATABASE
        sync: false
      - key: SQL_TLS
        value: 'true'
      - key: SQL_TLS_CA_BASE64
        sync: false
      - key: MODEL_RPM
        value: '10'
      - key: MODEL_INPUT_TPM
        value: '60000'
      - key: MODEL_WORKER_COUNT
        value: '1'
      - key: MODEL_EMBEDDING_RPM
        value: '15'
      - key: MODEL_EMBEDDING_INPUT_TPM
        value: '100000'
      - key: CORS_ALLOWED_ORIGINS
        value: https://mythborn.vercel.app,https://mythborn-abdulmoizx97-gmailcoms-projects.vercel.app,https://mythborn-git-main-abdulmoizx97-gmailcoms-projects.vercel.app,http://localhost:5173
