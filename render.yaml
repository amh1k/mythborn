# Configure secrets and origins before deployment. See DEPLOYMENT.md.
services:
  - type: web
    name: mythborn-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /mythborn-api
    healthCheckPath: /readyz
    envVars:
      - fromGroup: mythborn-runtime
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
  - type: worker
    name: mythborn-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /mythborn-worker
    numInstances: 1
    envVars:
      - fromGroup: mythborn-runtime
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: mythborn-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

envVarGroups:
  - name: mythborn-runtime
    envVars:
      - key: SUPABASE_PHOTO_BUCKET
        value: mythborn-photos
      - key: MODEL_RPM
        value: '10'
      - key: MODEL_INPUT_TPM
        value: '60000'
      - key: MODEL_WORKER_COUNT
        value: '1'
      - key: MODEL_EMBEDDING_RPM
        value: '15'
      - key: MODEL_EMBEDDING_INPUT_TPM
        value: '100000'
