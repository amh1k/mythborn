<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Temporal rate-limit recovery</title>
  <desc id="desc">A successful model response is checkpointed and the debate continues. On a quota error, Temporal records a visible retry time, waits on a durable timer, and retries the unfinished contribution. If the retry budget is exhausted, the round pauses for the player to retry later.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b98645"/></marker>
    <style>
      .bg{fill:#f7f2e9}.title{font:700 27px Georgia,serif;fill:#27231f}.sub{font:14px Arial,sans-serif;fill:#6d665d}.card{fill:#fffdf8;stroke:#d8c9b4;stroke-width:1.5}.gold{fill:#f3e5cf;stroke:#bd925d;stroke-width:1.5}.dark{fill:#302b27}.h{font:700 16px Arial,sans-serif;fill:#302b27}.lh{fill:#fffaf1}.p{font:13px Arial,sans-serif;fill:#625b53}.tiny{font:12px Arial,sans-serif;fill:#746c62}.line{fill:none;stroke:#b98645;stroke-width:2.2;marker-end:url(#arrow)}.retry{fill:none;stroke:#b98645;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.green{fill:#edf1e7;stroke:#93a27c;stroke-width:1.5}.red{fill:#f5e7df;stroke:#c38f77;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1200" height="500" rx="22"/>
  <text class="title" x="48" y="55">WHEN GEMINI SAYS “SLOW DOWN”</text>
  <text class="sub" x="48" y="82">A quota error becomes a scheduled retry, while finished agent work stays checkpointed.</text>

  <rect class="card" x="55" y="190" width="190" height="100" rx="16"/>
  <text class="h" x="82" y="225">Model call</text><text class="p" x="82" y="250">Agent activity</text><text class="tiny" x="82" y="273">Gemini API</text>
  <path class="line" d="M245 240H325"/>
  <rect class="green" x="325" y="125" width="250" height="105" rx="16"/>
  <text class="h" x="352" y="160">Success</text><text class="p" x="352" y="185">Validate and checkpoint</text><text class="p" x="352" y="207">then continue the debate</text>
  <rect class="gold" x="325" y="290" width="250" height="105" rx="16"/>
  <text class="h" x="352" y="325">Quota / rate limit</text><text class="p" x="352" y="350">Keep earlier contributions</text><text class="p" x="352" y="372">show the next retry time</text>
  <path class="line" d="M245 240H285V342H325"/>
  <path class="line" d="M575 342H650"/>
  <rect class="dark" x="650" y="290" width="210" height="105" rx="16"/>
  <text class="h lh" x="678" y="325">Temporal timer</text><text class="p lh" x="678" y="350">Durable wait; worker</text><text class="p lh" x="678" y="372">can restart safely</text>
  <path class="line" d="M860 342H930"/>
  <rect class="card" x="930" y="290" width="215" height="105" rx="16"/>
  <text class="h" x="958" y="325">Retry unfinished work</text><text class="p" x="958" y="350">Only the blocked agent</text><text class="p" x="958" y="372">runs again</text>
  <path class="retry" d="M1038 290V260H150V190"/>
  <text class="tiny" x="715" y="249">If quota still blocks the request, back off and wait again</text>
  <path class="retry" d="M1038 395V410H790V420"/>
  <rect class="red" x="650" y="420" width="280" height="58" rx="14"/>
  <text class="h" x="675" y="445">Retry budget exhausted</text><text class="tiny" x="675" y="466">Pause for attention; player can retry later</text>
</svg>
