name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mythborn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MYTHBORN_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/mythborn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - run: goose -dir migrations postgres "$MYTHBORN_TEST_DATABASE_URL" up
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api ./cmd/worker
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
