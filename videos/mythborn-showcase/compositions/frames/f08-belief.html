    #root-f08-belief .screen { display: block; width: 1920px; height: auto; clip-path: inset(0 16px 0 0); }

    #root-f08-belief .annotation-label { color: #ad3f2c; font: 600 22px/1.4 DM, sans-serif; letter-spacing: .09em; }

    #root-f08-belief .annotation p { margin: 26px 0 0; color: #354e62; font: 400 31px/1.4 DM, sans-serif; }

    #root-f08-belief .cursor svg { display: block; width: 100%; height: 100%; }

  </style>
    <div id="root-f08-belief" data-composition-id="f08-belief" data-width="1920" data-height="1080" data-duration="4.45" data-no-timeline>
      <div class="product" id="f08-belief-product">
        <div class="surface"><div class="camera" id="f08-belief-camera" data-layout-allow-overflow><img class="screen" id="f08-belief-screen" src="capture-polish/06-beliefs.png" alt="Real Priest panel showing the held belief about the tower’s light" width="1920" height="1128" loading="eager" decoding="sync" data-layout-allow-overflow></div></div>
        <div class="annotation" id="f08-belief-story-type" data-layout-allow-overflow><div class="annotation-label">WHAT THE WORLD KEEPS</div><h2 data-layout-allow-overlap><span class="type-line accent"><span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>Belief.</span></span></span></h2><p><span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>A</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>promise</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>to</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>the</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>river.</span></span></p></div>
      </div>

    </div><script>
    (() => {
      const root = document.getElementById("root-f08-belief");
      const START = 69;
      const DURATION = 4;
      const EASE = { arrive: "cubic-bezier(.16,1,.3,1)", carry: "cubic-bezier(.65,0,.35,1)", snap: "cubic-bezier(.22,.9,.3,1)", linear: "linear" };
      const animate = (element, keyframes, at, duration, easing = EASE.arrive) => {
        if (!element) return null;
        const animation = element.animate(keyframes, { delay: (START + at) * 1000, duration: duration * 1000, fill: "both", iterations: 1, easing });
        animation.pause();
        return animation;
      };
      const moveWords = (container, at, variant = 0) => {
        if (!container) return;
        container.querySelectorAll(".title-word").forEach((word, i) => {
          const from = variant % 3 === 0 ? "translate3d(0,115%,0) rotate(3deg)" : variant % 3 === 1 ? "translate3d(108%,0,0)" : "translate3d(0,-112%,0) scale(1.08)";
          animate(word, [{ transform: from, opacity: 0 }, { transform: "translate3d(0,0,0) rotate(0deg) scale(1)", opacity: 1 }], at + i * .065, .6, variant % 3 === 1 ? EASE.snap : EASE.arrive);
        });
        container.querySelectorAll(".body-word").forEach((word, i) => animate(word, [{ transform: "translate3d(0,105%,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], at + .66 + i * .023, .4));
      };
      const intro = root.querySelector(".intro");
      if (intro) {
        const handoff = 0;
        const span = DURATION + 0.45;
        animate(intro, [
          { transform: "translate3d(1920px,0,0)", opacity: 1, offset: 0, easing: EASE.carry },
          { transform: "translate3d(0,0,0)", opacity: 1, offset: 0.1101123595505618 },
          { transform: "translate3d(0,0,0)", opacity: 1, offset: (handoff + 0.45) / span, easing: EASE.carry },
          { transform: "translate3d(-1920px,0,0)", opacity: 0, offset: (handoff + .7 + 0.45) / span },
          { transform: "translate3d(-1920px,0,0)", opacity: 0, offset: 1 },
        ], -0.45, span, EASE.linear);
        animate(root.querySelector(".intro-kicker"), [{ transform: "translate3d(-45px,0,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], -.22, .48);
        moveWords(intro, -.12, 7);


      }
      const product = root.querySelector(".product");
      animate(product, [{ transform: "translate3d(0,1080px,0)", opacity: 1 }, { transform: "translate3d(0,0,0)", opacity: 1 }], -0.45, 0.7, EASE.carry);
      const poses = [[0,1.36,-1140,-100],[1.8,1.42,-1190,-140],[4,1.47,-1230,-190]];
      animate(root.querySelector(".camera"), poses.map(([t, s, x, y], i) => ({ transform: "translate3d(" + x + "px," + y + "px,0) scale(" + s + ")", offset: t / DURATION, easing: i === poses.length - 1 ? EASE.linear : EASE.carry })), 0, DURATION, EASE.linear);

      {
        const story = document.getElementById("f08-belief-story-type");
        animate(story, [{ transform: "translate3d(100px,0,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], .18, .55, EASE.snap);
        moveWords(story, .28, 7);
        animate(story.querySelector(".annotation-label"), [{ transform: "translate3d(0,-20px,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], .15, .5);
      }


    })();
  </script>
  </template></body></html>
