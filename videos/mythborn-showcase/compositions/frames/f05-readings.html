    </div><script>
    (() => {
      const root = document.getElementById("root-f05-readings");
      const START = 36;
      const DURATION = 10;
      const EASE = { arrive: "cubic-bezier(.16,1,.3,1)", carry: "cubic-bezier(.65,0,.35,1)", snap: "cubic-bezier(.22,.9,.3,1)", linear: "linear" };
      const animate = (element, keyframes, at, duration, easing = EASE.arrive) => {
        if (!element) return null;
        const animation = element.animate(keyframes, { delay: (START + at) * 1000, duration: duration * 1000, fill: "both", iterations: 1, easing });
        animation.pause();
        return animation;
      };
      const moveWords = (container, at, variant = 0) => {
        if (!container) return;
        container.querySelectorAll(".title-word").forEach((word, i) => {
          const from = variant % 3 === 0 ? "translate3d(0,115%,0) rotate(3deg)" : variant % 3 === 1 ? "translate3d(108%,0,0)" : "translate3d(0,-112%,0) scale(1.08)";
          animate(word, [{ transform: from, opacity: 0 }, { transform: "translate3d(0,0,0) rotate(0deg) scale(1)", opacity: 1 }], at + i * .065, .6, variant % 3 === 1 ? EASE.snap : EASE.arrive);
        });
        container.querySelectorAll(".body-word").forEach((word, i) => animate(word, [{ transform: "translate3d(0,105%,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], at + .66 + i * .023, .4));
      };
      const intro = root.querySelector(".intro");
      if (intro) {
        const handoff = 2.15;
        const span = DURATION + 0.45;
        animate(intro, [
          { transform: "translate3d(1920px,0,0)", opacity: 1, offset: 0, easing: EASE.carry },
          { transform: "translate3d(0,0,0)", opacity: 1, offset: 0.04688995215311005 },
          { transform: "translate3d(0,0,0)", opacity: 1, offset: (handoff + 0.45) / span, easing: EASE.carry },
          { transform: "translate3d(-1920px,0,0)", opacity: 0, offset: (handoff + .7 + 0.45) / span },
          { transform: "translate3d(-1920px,0,0)", opacity: 0, offset: 1 },
        ], -0.45, span, EASE.linear);
        animate(root.querySelector(".intro-kicker"), [{ transform: "translate3d(-45px,0,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], -.22, .48);
        moveWords(intro, -.12, 4);

        root.querySelectorAll(".role").forEach((role, i) => animate(role, [{ transform: "translate3d(180px,0,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], .32 + i * .16, .56, EASE.snap));
      }
      const product = root.querySelector(".product");
      animate(product, [{ transform: "translate3d(660px,0,0) scale(1.12)", opacity: 0 }, { transform: "translate3d(0,0,0) scale(1)", opacity: 1 }], 2.1, .8, EASE.carry);
      const poses = [[0,1.15,-320,-300],[2.15,1.15,-320,-300],[4.3,1.18,-325,-355],[6.7,1.2,-335,-390],[10,1.22,-340,-435]];
      animate(root.querySelector(".camera"), poses.map(([t, s, x, y], i) => ({ transform: "translate3d(" + x + "px," + y + "px,0) scale(" + s + ")", offset: t / DURATION, easing: i === poses.length - 1 ? EASE.linear : EASE.carry })), 0, DURATION, EASE.linear);
      {
        const annotation = document.getElementById("f05-readings-annotation-0");
        animate(annotation, [
          { opacity: 0, transform: "translate3d(95px,0,0)", offset: 0, easing: EASE.snap },
          { opacity: 1, transform: "translate3d(0,0,0)", offset: .25 },
          { opacity: 1, transform: "translate3d(-8px,0,0)", offset: .82, easing: EASE.snap },
          { opacity: 0, transform: "translate3d(-100px,0,0)", offset: 1 },
        ], 2.85, 1.65, EASE.linear);
        moveWords(annotation, 2.87, 4);
      }{
        const annotation = document.getElementById("f05-readings-annotation-1");
        animate(annotation, [
          { opacity: 0, transform: "translate3d(95px,0,0)", offset: 0, easing: EASE.snap },
          { opacity: 1, transform: "translate3d(0,0,0)", offset: .25 },
          { opacity: 1, transform: "translate3d(-8px,0,0)", offset: .82, easing: EASE.snap },
          { opacity: 0, transform: "translate3d(-100px,0,0)", offset: 1 },
        ], 4.55, 1.65, EASE.linear);
        moveWords(annotation, 4.569999999999999, 5);
      }{
        const annotation = document.getElementById("f05-readings-annotation-2");
        animate(annotation, [
          { opacity: 0, transform: "translate3d(95px,0,0)", offset: 0, easing: EASE.snap },
          { opacity: 1, transform: "translate3d(0,0,0)", offset: .25 },
          { opacity: 1, transform: "translate3d(-8px,0,0)", offset: .82, easing: EASE.snap },
          { opacity: 0, transform: "translate3d(-100px,0,0)", offset: 1 },
        ], 6.25, 1.65, EASE.linear);
        moveWords(annotation, 6.27, 6);
      }{
        const annotation = document.getElementById("f05-readings-annotation-3");
        animate(annotation, [
          { opacity: 0, transform: "translate3d(95px,0,0)", offset: 0, easing: EASE.snap },
          { opacity: 1, transform: "translate3d(0,0,0)", offset: .25 },
          { opacity: 1, transform: "translate3d(-8px,0,0)", offset: .82, easing: EASE.snap },
          { opacity: 0, transform: "translate3d(-100px,0,0)", offset: 1 },
        ], 7.95, 2.05, EASE.linear);
        moveWords(annotation, 7.97, 7);
      }
