  </style>
    <div id="root-f01-atlas" data-composition-id="f01-atlas" data-width="1920" data-height="1080" data-duration="8" data-no-timeline>

        <div class="surface"><div class="camera" id="f01-atlas-camera" data-layout-allow-overflow><img class="screen" id="f01-atlas-screen" src="capture-polish/01-atlas.png" alt="The real Mythborn civilization atlas" width="1920" height="1438" loading="eager" decoding="sync" data-layout-allow-overflow></div></div>

      </div>
      <div class="intro" id="f01-atlas-intro">
    <div class="intro-kicker">MYTHBORN</div>
    <h1 data-layout-allow-overlap><span class="type-line"><span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>Go</span></span> <span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>outside.</span></span></span><span class="type-line accent"><span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>Bring</span></span> <span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>back</span></span> <span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>a</span></span> <span class="word-mask" data-layout-allow-overflow><span class="title-word" data-layout-allow-overflow>story.</span></span></span></h1>
    <p class="intro-body"><span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>Turn</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>a</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>short</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>walk</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>into</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>your</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>civilization’s</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>next</span></span> <span class="word-mask" data-layout-allow-overflow><span class="body-word" data-layout-allow-overflow>discovery.</span></span></p>

    </div><script>
    (() => {
      const root = document.getElementById("root-f01-atlas");
      const START = 0;
      const DURATION = 8;
      const EASE = { arrive: "cubic-bezier(.16,1,.3,1)", carry: "cubic-bezier(.65,0,.35,1)", snap: "cubic-bezier(.22,.9,.3,1)", linear: "linear" };
      const animate = (element, keyframes, at, duration, easing = EASE.arrive) => {
        if (!element) return null;
        const animation = element.animate(keyframes, { delay: (START + at) * 1000, duration: duration * 1000, fill: "both", iterations: 1, easing });
        animation.pause();
        return animation;
      };
      const moveWords = (container, at, variant = 0) => {
        if (!container) return;
        container.querySelectorAll(".title-word").forEach((word, i) => {
          const from = variant % 3 === 0 ? "translate3d(0,115%,0) rotate(3deg)" : variant % 3 === 1 ? "translate3d(108%,0,0)" : "translate3d(0,-112%,0) scale(1.08)";
          animate(word, [{ transform: from, opacity: 0 }, { transform: "translate3d(0,0,0) rotate(0deg) scale(1)", opacity: 1 }], at + i * .065, .6, variant % 3 === 1 ? EASE.snap : EASE.arrive);
        });
        container.querySelectorAll(".body-word").forEach((word, i) => animate(word, [{ transform: "translate3d(0,105%,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], at + .66 + i * .023, .4));
      };
      const intro = root.querySelector(".intro");
      if (intro) {
        const handoff = 2.5;
        const span = DURATION + 0;
        animate(intro, [
          { transform: "translate3d(0px,0,0)", opacity: 1, offset: 0, easing: EASE.carry },
          { transform: "translate3d(0,0,0)", opacity: 1, offset: 0.01 },
          { transform: "translate3d(0,0,0)", opacity: 1, offset: (handoff + 0) / span, easing: EASE.carry },
          { transform: "translate3d(-1920px,0,0)", opacity: 0, offset: (handoff + .7 + 0) / span },
          { transform: "translate3d(-1920px,0,0)", opacity: 0, offset: 1 },
        ], -0, span, EASE.linear);
        animate(root.querySelector(".intro-kicker"), [{ transform: "translate3d(-45px,0,0)", opacity: 0 }, { transform: "translate3d(0,0,0)", opacity: 1 }], .1, .48);
        moveWords(intro, .16, 0);


      }
      const product = root.querySelector(".product");
      animate(product, [{ transform: "translate3d(660px,0,0) scale(1.12)", opacity: 0 }, { transform: "translate3d(0,0,0) scale(1)", opacity: 1 }], 2.45, .8, EASE.carry);
      const poses = [[0,2.4,-2160,-372],[2.5,2.4,-2160,-372],[4.2,1.5,-480,-180],[6,1.35,-270,-660],[8,1.4,-285,-845]];
      animate(root.querySelector(".camera"), poses.map(([t, s, x, y], i) => ({ transform: "translate3d(" + x + "px," + y + "px,0) scale(" + s + ")", offset: t / DURATION, easing: i === poses.length - 1 ? EASE.linear : EASE.carry })), 0, DURATION, EASE.linear);




    })();
  </script>
