# enable-template
log:
  stdout: true
  level: info
persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 128
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: '{{ env "SQL_HOST" }}:{{ env "SQL_PORT" | default "5432" }}'
        connectProtocol: tcp
        user: {{ env "SQL_USER" | quote }}
        password: {{ env "SQL_PASSWORD" | quote }}
        maxConns: 5
        maxIdleConns: 2
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: '{{ env "SQL_HOST" }}:{{ env "SQL_PORT" | default "5432" }}'
        connectProtocol: tcp
        user: {{ env "SQL_USER" | quote }}
        password: {{ env "SQL_PASSWORD" | quote }}
        maxConns: 3
        maxIdleConns: 1
        maxConnLifetime: 1h
global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: {{ env "TEMPORAL_BROADCAST_ADDRESS" | quote }}
  pprof:
    port: 7936
services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: 0.0.0.0
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 0.0.0.0
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 0.0.0.0
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 0.0.0.0
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: 127.0.0.1:7233
publicClient:
  hostPort: 127.0.0.1:7233
